name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests del api
        working-directory: api
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Tests del panel
        working-directory: backoffice
        run: node --test 'tests/*.test.ts'
